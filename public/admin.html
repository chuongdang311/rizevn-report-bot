<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rize — Admin Reports</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; min-height: 100vh; }

    .header { background: #1a6b3c; color: white; padding: 16px 24px; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 18px; }

    .login-container { max-width: 360px; margin: 80px auto; background: white; border-radius: 12px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
    .login-container h2 { margin-bottom: 20px; color: #1a6b3c; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 10px 14px; border: 1.5px solid #ddd; border-radius: 8px;
      font-size: 15px; margin-bottom: 12px; outline: none;
    }
    input:focus { border-color: #1a6b3c; }
    .btn { background: #1a6b3c; color: white; border: none; padding: 11px 20px; border-radius: 8px; font-size: 15px; cursor: pointer; width: 100%; }
    .btn:hover { background: #134d2c; }
    .btn-sm { width: auto; padding: 6px 14px; font-size: 13px; border-radius: 6px; }

    .admin-container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .table-scroll { overflow-x: auto; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stat-card { background: white; border-radius: 10px; padding: 16px 20px; flex: 1; min-width: 120px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .stat-card .num { font-size: 28px; font-weight: 700; color: #1a6b3c; }
    .stat-card .label { font-size: 12px; color: #888; margin-top: 2px; }

    table { width: 100%; min-width: 960px; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
    th { background: #1a6b3c; color: white; padding: 12px 14px; text-align: left; font-size: 13px; font-weight: 600; white-space: nowrap; }
    td { padding: 12px 14px; border-bottom: 1px solid #f0f0f0; font-size: 13px; vertical-align: top; }
    th:nth-child(1), td:nth-child(1) { min-width: 160px; }  /* Mã báo cáo */
    th:nth-child(2), td:nth-child(2) { min-width: 90px; }   /* Loại */
    th:nth-child(3), td:nth-child(3) { min-width: 180px; }  /* Người báo cáo */
    th:nth-child(4), td:nth-child(4) { min-width: 150px; }  /* Tài khoản */
    th:nth-child(5), td:nth-child(5) { min-width: 260px; }  /* Vấn đề */
    th:nth-child(6), td:nth-child(6) { min-width: 90px; }   /* Khẩn cấp */
    th:nth-child(7), td:nth-child(7) { min-width: 130px; }  /* Trạng thái */
    th:nth-child(8), td:nth-child(8) { min-width: 170px; }  /* Cập nhật */
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f9fffe; }

    .status-badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;
    }
    .status-processing { background: #fff3cd; color: #856404; }
    .status-done { background: #d1fae5; color: #065f46; }
    .status-need-info { background: #fee2e2; color: #991b1b; }
    .status-cant-repro { background: #e0e7ff; color: #3730a3; }

    .type-bug { color: #dc2626; font-weight: 600; }
    .type-admin { color: #2563eb; font-weight: 600; }

    select { padding: 5px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }

    .error { color: #dc2626; font-size: 13px; margin-top: 8px; }
    .hidden { display: none; }

    .filter-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .filter-row select, .filter-row input { padding: 8px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 14px; }

    .urgency-high { color: #dc2626; font-weight: 600; }
    .urgency-medium { color: #d97706; }
    .urgency-low { color: #059669; }

    tr.clickable-row { cursor: pointer; }

    /* ── Detail panel ── */
    .panel-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.35); z-index: 100;
    }
    .panel-overlay.open { display: block; }
    .detail-panel {
      position: fixed; top: 0; right: -520px; width: 500px; max-width: 95vw;
      height: 100vh; background: white; box-shadow: -4px 0 24px rgba(0,0,0,0.15);
      z-index: 101; display: flex; flex-direction: column;
      transition: right 0.25s ease;
      overflow: hidden;
    }
    .detail-panel.open { right: 0; }
    .panel-header {
      background: #1a6b3c; color: white; padding: 16px 20px;
      display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    }
    .panel-header h2 { font-size: 15px; margin: 0; }
    .panel-close {
      background: none; border: none; color: white; font-size: 22px;
      cursor: pointer; line-height: 1; padding: 0 4px;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 20px; }
    .panel-section { margin-bottom: 20px; }
    .panel-section h3 {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #888; margin-bottom: 8px;
    }
    .panel-section p, .panel-section pre {
      font-size: 13px; color: #222; line-height: 1.6;
      white-space: pre-wrap; word-break: break-word;
      background: #f7f7f7; border-radius: 8px; padding: 12px; margin: 0;
    }
    .meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; }
    .meta-grid .label { color: #888; white-space: nowrap; }
    .meta-grid .val   { color: #222; font-weight: 500; word-break: break-word; }

    /* Conversation transcript */
    .transcript { display: flex; flex-direction: column; gap: 10px; }
    .bubble { border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.5; max-width: 90%; white-space: pre-wrap; word-break: break-word; }
    .bubble.user { background: #e8f5ee; align-self: flex-end; color: #1a3d28; }
    .bubble.assistant { background: #f0f0f0; align-self: flex-start; color: #222; }
    .bubble-label { font-size: 10px; color: #aaa; margin-bottom: 2px; }
    .user-side { align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; max-width: 90%; }
    .assistant-side { align-self: flex-start; display: flex; flex-direction: column; align-items: flex-start; max-width: 90%; }
  </style>
</head>
<body>

<!-- Detail panel -->
<div class="panel-overlay" id="panelOverlay" onclick="closePanel()"></div>
<div class="detail-panel" id="detailPanel">
  <div class="panel-header">
    <h2 id="panelTitle">Chi tiết báo cáo</h2>
    <button class="panel-close" onclick="closePanel()">×</button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</div>

<div class="header">
  <span style="font-size:22px">🌾</span>
  <h1>Rize Admin — Quản lý báo cáo</h1>
</div>

<!-- Login -->
<div class="login-container" id="loginSection">
  <h2>🔐 Đăng nhập Admin</h2>
  <input type="password" id="adminKeyInput" placeholder="Admin key" onkeydown="if(event.key==='Enter') login()" />
  <button class="btn" onclick="login()">Đăng nhập</button>
  <div class="error hidden" id="loginError">Sai admin key. Thử lại.</div>
</div>

<!-- Admin panel -->
<div class="admin-container hidden" id="adminSection">
  <div class="stats-row" id="statsRow"></div>

  <div class="filter-row">
    <select id="filterStatus" onchange="renderTable()">
      <option value="">Tất cả trạng thái</option>
      <option value="Đang xử lý">Đang xử lý</option>
      <option value="Đã xử lý">Đã xử lý</option>
      <option value="Cần thêm thông tin">Cần thêm thông tin</option>
      <option value="Không tái hiện được">Không tái hiện được</option>
    </select>
    <select id="filterType" onchange="renderTable()">
      <option value="">Tất cả loại</option>
      <option value="bug">Bug Report</option>
      <option value="admin">Admin Request</option>
    </select>
    <button class="btn btn-sm" onclick="loadReports()">🔄 Làm mới</button>
  </div>

  <div class="table-scroll">
    <table id="reportsTable">
      <thead>
        <tr>
          <th>Mã báo cáo</th>
          <th>Loại</th>
          <th>Người báo cáo</th>
          <th>Tài khoản</th>
          <th>Vấn đề</th>
          <th>Khẩn cấp</th>
          <th>Trạng thái</th>
          <th>Cập nhật</th>
        </tr>
      </thead>
      <tbody id="reportsBody"></tbody>
    </table>
  </div>
</div>

<script>
  let adminKey = '';
  let allReports = [];

  function login() {
    const key = document.getElementById('adminKeyInput').value.trim();
    if (!key) return;

    fetch(`/admin/reports?adminKey=${encodeURIComponent(key)}`)
      .then(r => {
        if (!r.ok) throw new Error('Forbidden');
        return r.json();
      })
      .then(data => {
        adminKey = key;
        allReports = data;
        document.getElementById('loginSection').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        renderStats();
        renderTable();
      })
      .catch(() => {
        document.getElementById('loginError').classList.remove('hidden');
      });
  }

  function loadReports() {
    fetch(`/admin/reports?adminKey=${encodeURIComponent(adminKey)}`)
      .then(r => r.json())
      .then(data => {
        allReports = data;
        renderStats();
        renderTable();
      });
  }

  function renderStats() {
    const total = allReports.length;
    const open = allReports.filter(r => r.status === 'Đang xử lý').length;
    const done = allReports.filter(r => r.status === 'Đã xử lý').length;
    const bugs = allReports.filter(r => r.type === 'bug').length;

    document.getElementById('statsRow').innerHTML = `
      <div class="stat-card"><div class="num">${total}</div><div class="label">Tổng báo cáo</div></div>
      <div class="stat-card"><div class="num">${open}</div><div class="label">Đang xử lý</div></div>
      <div class="stat-card"><div class="num">${done}</div><div class="label">Đã xử lý</div></div>
      <div class="stat-card"><div class="num">${bugs}</div><div class="label">Bug Reports</div></div>
    `;
  }

  function renderTable() {
    const filterStatus = document.getElementById('filterStatus').value;
    const filterType = document.getElementById('filterType').value;

    const filtered = allReports.filter(r => {
      if (filterStatus && r.status !== filterStatus) return false;
      if (filterType && r.type !== filterType) return false;
      return true;
    });

    const body = document.getElementById('reportsBody');
    if (!filtered.length) {
      body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#999;padding:24px">Không có báo cáo nào</td></tr>';
      return;
    }

    body.innerHTML = filtered.map(r => {
      const urgencyClass = r.urgency === 'High' ? 'urgency-high' : r.urgency === 'Low' ? 'urgency-low' : 'urgency-medium';
      const statusClass = r.status === 'Đã xử lý' ? 'status-done' : r.status === 'Cần thêm thông tin' ? 'status-need-info' : r.status === 'Không tái hiện được' ? 'status-cant-repro' : 'status-processing';
      const idx = allReports.indexOf(r);
      return `
        <tr class="clickable-row" onclick="openPanel(${idx})">
          <td><code style="font-size:12px">${r.reportId || ''}</code><br><small style="color:#999">${r.createdAt || ''}</small></td>
          <td class="${r.type === 'bug' ? 'type-bug' : 'type-admin'}">${r.type === 'bug' ? '🐛 Bug' : '📋 Admin'}</td>
          <td>${escapeHtml(r.email || r.name || '')}</td>
          <td>${escapeHtml(r.account || '')}</td>
          <td>${escapeHtml((r.summary || r.issue || '').substring(0, 100))}</td>
          <td class="${urgencyClass}">${r.urgency || ''}</td>
          <td><span class="status-badge ${statusClass}">${r.status || ''}</span></td>
          <td onclick="event.stopPropagation()">
            <select onchange="updateStatus('${r.reportId}', this.value)">
              <option value="">Đổi trạng thái...</option>
              <option value="Đang xử lý">Đang xử lý</option>
              <option value="Đã xử lý">Đã xử lý</option>
              <option value="Cần thêm thông tin">Cần thêm thông tin</option>
              <option value="Không tái hiện được">Không tái hiện được</option>
            </select>
          </td>
        </tr>
      `;
    }).join('');
  }

  function updateStatus(reportId, status) {
    if (!status) return;
    fetch('/admin/status', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminKey, reportId, status })
    })
    .then(r => r.json())
    .then(data => {
      if (data.success) {
        const report = allReports.find(r => r.reportId === reportId);
        if (report) report.status = status;
        renderStats();
        renderTable();
      } else {
        alert('Cập nhật thất bại.');
      }
    });
  }

  function escapeHtml(text) {
    return (text || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ── Detail panel ──────────────────────────────────────────────────────────
  function openPanel(idx) {
    const r = allReports[idx];
    if (!r) return;

    document.getElementById('panelTitle').textContent = r.reportId || 'Chi tiết báo cáo';

    const urgencyLabel = r.urgency === 'High' ? '🔴 Cao' : r.urgency === 'Low' ? '🟢 Thấp' : '🟡 Trung bình';
    const imgNote = r.imageCount > 0 ? `${r.imageCount} file đính kèm` : 'Không có';

    let transcriptHtml = '';
    if (r.history && r.history.length > 0) {
      const bubbles = r.history.map(h => {
        const isUser = h.role === 'user';
        const side   = isUser ? 'user-side' : 'assistant-side';
        const cls    = isUser ? 'bubble user' : 'bubble assistant';
        const lbl    = isUser ? 'AG' : 'Bot';
        return `<div class="${side}"><div class="bubble-label">${lbl}</div><div class="${cls}">${escapeHtml(h.content)}</div></div>`;
      }).join('');
      transcriptHtml = `
        <div class="panel-section">
          <h3>Lịch sử hội thoại</h3>
          <div class="transcript">${bubbles}</div>
        </div>`;
    } else {
      transcriptHtml = `
        <div class="panel-section">
          <h3>Lịch sử hội thoại</h3>
          <p style="color:#aaa;background:none;padding:0">Không có dữ liệu — chỉ khả dụng cho báo cáo mới sau khi cập nhật này được deploy.</p>
        </div>`;
    }

    document.getElementById('panelBody').innerHTML = `
      <div class="panel-section">
        <h3>Thông tin chung</h3>
        <div class="meta-grid">
          <span class="label">Email</span>      <span class="val">${escapeHtml(r.email || '—')}</span>
          <span class="label">PG / Nông dân</span><span class="val">${escapeHtml(r.account || '—')}</span>
          <span class="label">Nền tảng</span>   <span class="val">${escapeHtml(r.platform || '—')}</span>
          <span class="label">Loại</span>        <span class="val">${escapeHtml(r.category || '—')}</span>
          <span class="label">Khẩn cấp</span>   <span class="val">${urgencyLabel}</span>
          <span class="label">Ảnh đính kèm</span><span class="val">${imgNote}</span>
          <span class="label">Gửi lúc</span>    <span class="val">${escapeHtml(r.createdAt || '—')}</span>
        </div>
      </div>

      <div class="panel-section">
        <h3>Tóm tắt</h3>
        <p>${escapeHtml(r.summary || r.issue || '—')}</p>
      </div>

      <div class="panel-section">
        <h3>Mô tả đầy đủ</h3>
        <pre>${escapeHtml(r.details || '—')}</pre>
      </div>

      ${r.steps ? `<div class="panel-section"><h3>Các bước tái hiện</h3><pre>${escapeHtml(r.steps)}</pre></div>` : ''}

      ${transcriptHtml}
    `;

    document.getElementById('panelOverlay').classList.add('open');
    document.getElementById('detailPanel').classList.add('open');
  }

  function closePanel() {
    document.getElementById('panelOverlay').classList.remove('open');
    document.getElementById('detailPanel').classList.remove('open');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
</script>
</body>
</html>
