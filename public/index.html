<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Rize Vietnam — Báo cáo vấn đề</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1a6b3c;
      --green-dark: #134d2c;
      --green-light: #e8f5ee;
      --user-bubble: #1a6b3c;
      --bot-bubble: #f0f0f0;
      --text-dark: #1a1a1a;
      --text-light: #666;
      --bg: #f5f5f5;
      --white: #ffffff;
      --shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--green);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
      z-index: 10;
    }
    .header-avatar {
      width: 40px; height: 40px;
      background: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .header-info h1 { font-size: 16px; font-weight: 600; }
    .header-info p { font-size: 12px; opacity: 0.8; }
    .online-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    /* Chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    /* Messages */
    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--green);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 14.5px;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .bubble.bot {
      background: var(--bot-bubble);
      color: var(--text-dark);
      border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .bubble strong, .bubble b { font-weight: 600; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .typing-dots {
      background: var(--bot-bubble);
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .typing-dots span {
      width: 8px; height: 8px;
      background: #aaa;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Quick replies */
    .quick-replies {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0 4px 38px;
    }
    .qr-btn {
      background: white;
      border: 1.5px solid var(--green);
      color: var(--green);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
      font-weight: 500;
    }
    .qr-btn:hover, .qr-btn:active {
      background: var(--green);
      color: white;
    }
    .qr-btn:disabled { opacity: 0.5; pointer-events: none; }

    /* Image preview in chat */
    .image-bubble {
      max-width: 220px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .image-bubble img {
      width: 100%;
      display: block;
    }

    /* Input area */
    .input-area {
      background: white;
      border-top: 1px solid #e0e0e0;
      padding: 10px 12px;
      flex-shrink: 0;
    }

    /* Upload preview bar */
    .upload-preview {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: var(--green-light);
      border-radius: 10px;
      margin-bottom: 8px;
    }
    .upload-preview.visible { display: flex; }
    .upload-preview img {
      width: 44px; height: 44px;
      object-fit: cover;
      border-radius: 6px;
    }
    .upload-preview-name {
      flex: 1;
      font-size: 13px;
      color: var(--green-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .remove-upload {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    .input-box {
      flex: 1;
      background: #f5f5f5;
      border: 1.5px solid transparent;
      border-radius: 22px;
      padding: 10px 16px;
      font-size: 15px;
      outline: none;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    .input-box:focus { border-color: var(--green); background: white; }
    .input-box::placeholder { color: #aaa; }

    .attach-btn {
      width: 42px; height: 42px;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .attach-btn:hover { background: #e0e0e0; }
    .attach-btn.has-file { background: var(--green-light); }

    .send-btn {
      width: 42px; height: 42px;
      background: var(--green);
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--green-dark); }
    .send-btn:disabled { background: #ccc; cursor: not-allowed; }
    .send-btn svg { fill: white; width: 18px; height: 18px; }

    #file-input { display: none; }

    /* Upload prompt (shown when bot asks for photo) */
    .upload-prompt {
      display: none;
      background: var(--green-light);
      border: 1.5px dashed var(--green);
      border-radius: 12px;
      padding: 14px;
      text-align: center;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .upload-prompt.visible { display: block; }
    .upload-prompt-text {
      font-size: 13px;
      color: var(--green-dark);
      margin-top: 4px;
    }

    /* Success banner */
    .success-banner {
      background: var(--green);
      color: white;
      text-align: center;
      padding: 12px;
      font-size: 14px;
      animation: fadeIn 0.3s ease;
    }
    .report-id-badge {
      display: inline-block;
      background: rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 2px 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-avatar">🌾</div>
  <div class="header-info">
    <h1>Rize Vietnam</h1>
    <p><span class="online-dot"></span>Bot báo cáo</p>
  </div>
</div>

<div class="chat-area" id="chatArea"></div>

<div class="input-area">
  <div class="upload-preview" id="uploadPreview">
    <img id="previewThumb" src="" alt="preview" />
    <span class="upload-preview-name" id="previewName"></span>
    <button class="remove-upload" onclick="removeImage()" title="Xóa ảnh">✕</button>
  </div>
  <div class="upload-prompt" id="uploadPrompt" onclick="document.getElementById('file-input').click()">
    📷 <strong>Nhấn để đính kèm ảnh</strong>
    <div class="upload-prompt-text">Hỗ trợ JPG, PNG, GIF (tối đa 10MB)</div>
  </div>
  <div class="input-row">
    <input type="file" id="file-input" accept="image/*" capture="environment" onchange="handleFileSelect(event)" />
    <button class="attach-btn" id="attachBtn" onclick="document.getElementById('file-input').click()" title="Đính kèm ảnh">📎</button>
    <textarea
      class="input-box"
      id="inputBox"
      placeholder="Nhập tin nhắn..."
      rows="1"
      onkeydown="handleKeyDown(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Gửi">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const SESSION_ID = 'session_' + Math.random().toString(36).slice(2);
  let pendingImageData = null;
  let isWaiting = false;
  let showUploadUI = false;

  const chatArea = document.getElementById('chatArea');
  const inputBox = document.getElementById('inputBox');
  const sendBtn = document.getElementById('sendBtn');
  const uploadPrompt = document.getElementById('uploadPrompt');
  const uploadPreview = document.getElementById('uploadPreview');
  const attachBtn = document.getElementById('attachBtn');

  // ── Init ──────────────────────────────────────────────────────────────────
  window.addEventListener('load', () => {
    fetch('/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: SESSION_ID, text: '__init__' })
    })
    .then(r => r.json())
    .then(handleResponse)
    .catch(() => appendBot('Xin chào! 👋 Hãy mô tả vấn đề bạn gặp phải.'));
  });

  // ── Send message ──────────────────────────────────────────────────────────
  async function sendMessage(quickReplyText) {
    const text = quickReplyText || inputBox.value.trim();
    if ((!text && !pendingImageData) || isWaiting) return;

    // Show user bubble
    if (text) appendUser(text);
    if (pendingImageData && !quickReplyText) appendUserImage(pendingImageData);

    inputBox.value = '';
    autoResize(inputBox);
    disableQuickReplies();
    showTyping();
    setWaiting(true);

    const imageToSend = pendingImageData;
    pendingImageData = null;
    uploadPreview.classList.remove('visible');
    attachBtn.classList.remove('has-file');
    uploadPrompt.classList.remove('visible');
    showUploadUI = false;

    try {
      const res = await fetch('/message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: SESSION_ID, text, imageData: imageToSend })
      });
      const data = await res.json();
      removeTyping();
      handleResponse(data);
    } catch (e) {
      removeTyping();
      appendBot('Có lỗi xảy ra. Vui lòng thử lại.');
    }

    setWaiting(false);
  }

  function handleResponse(data) {
    if (!data) return;

    // Show messages
    if (data.messages) {
      data.messages.forEach(msg => appendBot(msg));
    }

    // Show quick replies
    if (data.quickReplies && data.quickReplies.length) {
      appendQuickReplies(data.quickReplies);
    }

    // Show upload UI
    if (data.showUpload) {
      showUploadUI = true;
      uploadPrompt.classList.add('visible');
    }

    // Success
    if (data.done && data.reportId) {
      showSuccessBanner(data.reportId);
    }

    scrollToBottom();
  }

  // ── DOM helpers ───────────────────────────────────────────────────────────
  function appendBot(text) {
    const row = document.createElement('div');
    row.className = 'message-row bot';
    row.innerHTML = `
      <div class="avatar">🌾</div>
      <div class="bubble bot">${formatText(text)}</div>
    `;
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function appendUser(text) {
    const row = document.createElement('div');
    row.className = 'message-row user';
    row.innerHTML = `<div class="bubble user">${escapeHtml(text)}</div>`;
    chatArea.appendChild(row);
  }

  function appendUserImage(dataUrl) {
    const row = document.createElement('div');
    row.className = 'message-row user';
    row.innerHTML = `<div class="image-bubble"><img src="${dataUrl}" alt="Ảnh đính kèm" /></div>`;
    chatArea.appendChild(row);
  }

  function appendQuickReplies(replies) {
    const container = document.createElement('div');
    container.className = 'quick-replies';
    container.id = 'current-qr';
    replies.forEach(reply => {
      const btn = document.createElement('button');
      btn.className = 'qr-btn';
      btn.textContent = reply;
      btn.onclick = () => {
        disableQuickReplies();
        sendMessage(reply);
      };
      container.appendChild(btn);
    });
    chatArea.appendChild(container);
    scrollToBottom();
  }

  function disableQuickReplies() {
    const qr = document.getElementById('current-qr');
    if (qr) {
      qr.querySelectorAll('.qr-btn').forEach(b => b.disabled = true);
      qr.removeAttribute('id');
    }
  }

  function showTyping() {
    const row = document.createElement('div');
    row.className = 'typing-indicator';
    row.id = 'typing';
    row.innerHTML = `
      <div class="avatar">🌾</div>
      <div class="typing-dots"><span></span><span></span><span></span></div>
    `;
    chatArea.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function showSuccessBanner(reportId) {
    const banner = document.createElement('div');
    banner.className = 'success-banner';
    banner.innerHTML = `✅ Báo cáo đã được gửi!<br><span class="report-id-badge">${reportId}</span>`;
    chatArea.appendChild(banner);
    scrollToBottom();
  }

  // ── Image upload ──────────────────────────────────────────────────────────
  function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > 10 * 1024 * 1024) {
      alert('Ảnh quá lớn. Vui lòng chọn ảnh nhỏ hơn 10MB.');
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      pendingImageData = e.target.result;
      document.getElementById('previewThumb').src = pendingImageData;
      document.getElementById('previewName').textContent = file.name;
      uploadPreview.classList.add('visible');
      attachBtn.classList.add('has-file');
      uploadPrompt.classList.remove('visible');
    };
    reader.readAsDataURL(file);
    event.target.value = '';
  }

  function removeImage() {
    pendingImageData = null;
    uploadPreview.classList.remove('visible');
    attachBtn.classList.remove('has-file');
    if (showUploadUI) uploadPrompt.classList.add('visible');
  }

  // ── Utils ─────────────────────────────────────────────────────────────────
  function formatText(text) {
    return escapeHtml(text)
      .replace(/\*(.*?)\*/g, '<strong>$1</strong>')
      .replace(/_(.*?)_/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  function escapeHtml(text) {
    return (text || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function scrollToBottom() {
    setTimeout(() => {
      chatArea.scrollTop = chatArea.scrollHeight;
    }, 50);
  }

  function setWaiting(val) {
    isWaiting = val;
    sendBtn.disabled = val;
    inputBox.disabled = val;
  }

  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }
</script>
</body>
</html>
